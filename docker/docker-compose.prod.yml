# =========================================================================
# Nexus ECM — Production stack
# Usage: docker compose -f docker/docker-compose.prod.yml --env-file .env up -d --build
# Existing VPS Caddy terminates TLS; this stack joins its external Docker network.
# PostgreSQL persists data across stack renames via explicit volume names.
# Redis is shared with n8n on DB index 1; n8n uses its own default DB index.
# Run migrations once after first boot:
#   docker compose -f docker/docker-compose.prod.yml exec api \
#     node packages/database/node_modules/.bin/prisma migrate deploy --schema packages/database/schema.prisma
# =========================================================================
name: nexus-ecm

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-ecm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: rustfs/rustfs:1.0.7
    restart: always
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: always
    env_file: ../.env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_URL: ${WEB_URL:?Set WEB_URL to the public frontend URL}
      GEOIP_COUNTRY_FILTER_ENABLED: ${GEOIP_COUNTRY_FILTER_ENABLED:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://n8n-redis:6379/1
      MINIO_ENDPOINT: minio
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      default: {}
      proxy:
        aliases:
          - nexus-api
    healthcheck:
      test: ["CMD", "wget", "--header=X-Forwarded-Proto:https", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        API_URL: ${API_URL:?Set API_URL to the public HTTPS origin}
        NEXT_PUBLIC_API_URL: ${API_URL}/api/v1
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL}/api/v1
    depends_on:
      - api
    networks:
      proxy:
        aliases:
          - nexus-web

volumes:
  postgres_data:
    name: nexus-ecm-prod_postgres_data
  minio_data:
    name: nexus-ecm-prod_minio_data

networks:
  default: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-n8n_net}
